<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encomendas de Cabazes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mu:#6b7280;--bd:#d9dde5;--ac:#1f6feb}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1e222a;--tx:#e8eaf0;--mu:#9aa3b2;--bd:#323846;--ac:#4c8dff}}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px}
h1{font-size:20px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select,textarea,button{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
button{cursor:pointer;background:var(--ac);color:#fff;border-color:var(--ac)}
button.sec{background:transparent;color:var(--tx);border-color:var(--bd)}
.wide{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
th{font-size:12px;color:var(--mu)}
td.n,th.n{text-align:right}
.tot{margin-left:auto;font-weight:600}
</style>
</head>
<body>
<div id="lg" class="card" hidden><form id="lf" class="row"><input id="pin" type="password" autocomplete="off" placeholder="PIN" required><button>Entrar</button><span id="lm" style="color:#d33"></span></form></div>
<div id="app" hidden>
<h1>Encomendas de Cabazes</h1>

<div class="card">
<form id="f">
 <label>Cliente*<input id="cliente" required></label>
 <label>Contacto<input id="contacto"></label>
 <label>Tipo de cabaz*<input id="tipo" list="tipos" required></label>
 <datalist id="tipos"></datalist>
 <label>Quantidade*<input id="qtd" type="number" min="1" value="1" required></label>
 <label>Preço unitário (€)*<input id="preco" type="number" min="0" step="0.01" required></label>
 <label>Data da encomenda<input id="data" type="date"></label>
 <label>Data de entrega<input id="entrega" type="date"></label>
 <label>Estado<select id="estado"><option>Pendente</option><option>Pago</option><option>Entregue</option><option>Cancelado</option></select></label>
 <label class="wide">Observações<textarea id="obs" rows="2"></textarea></label>
 <div class="row wide">
  <button type="submit" id="save">Adicionar encomenda</button>
  <button type="button" class="sec" id="cancel" hidden>Cancelar edição</button>
 </div>
</form>
</div>

<div class="card">
 <div class="row" style="margin-bottom:10px">
  <input id="q" placeholder="Pesquisar…" style="min-width:200px">
  <select id="fe"><option value="">Todos os estados</option><option>Pendente</option><option>Pago</option><option>Entregue</option><option>Cancelado</option></select>
  <button id="xl">Exportar para Excel</button>
  <span class="tot" id="tot"></span>
 </div>
 <div class="tw"><table>
  <thead><tr><th>Nº</th><th>Data</th><th>Cliente</th><th>Contacto</th><th>Cabaz</th><th class="n">Qtd</th><th class="n">Preço</th><th class="n">Total</th><th>Entrega</th><th>Estado</th><th>Obs.</th><th></th></tr></thead>
  <tbody id="tb"></tbody>
 </table></div>
</div>
</div>

<script>
const API='/api/encomendas';
let db={items:[]},editId=null;
let pin=sessionStorage.getItem('pin')||'';
const gate=ok=>{$('lg').hidden=ok;$('app').hidden=!ok};
const fail=(e,p)=>{if(e.message!=='401')alert(p+e.message)};
async function api(m,id,b){const r=await fetch(API+(id?'?id='+id:''),{method:m,headers:{'content-type':'application/json','x-pin':pin},body:b?JSON.stringify(b):undefined});
  if(r.status===401){const had=pin;pin='';sessionStorage.removeItem('pin');gate(false);$('lm').textContent=had?'PIN incorreto':'';throw new Error('401')}
  if(!r.ok)throw new Error(await r.text());return r.json()}
async function load(){try{db.items=await api('GET');render()}catch(e){fail(e,'Erro ao carregar: ')}}
const $=id=>document.getElementById(id);
const F=['cliente','contacto','tipo','qtd','preco','data','entrega','estado','obs'];
const eur=n=>n.toLocaleString('pt-PT',{style:'currency',currency:'EUR'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);

function reset(){
  $('f').reset();$('data').value=today();editId=null;
  $('save').textContent='Adicionar encomenda';$('cancel').hidden=true;
}
function filtered(){
  const q=$('q').value.toLowerCase(),e=$('fe').value;
  return db.items.filter(i=>(!e||i.estado===e)&&(!q||[i.cliente,i.contacto,i.tipo,i.obs,i.id].join(' ').toLowerCase().includes(q)));
}
function render(){
  const list=filtered();
  $('tb').innerHTML=list.map(i=>`<tr><td>${i.id}</td><td>${esc(i.data)}</td><td>${esc(i.cliente)}</td><td>${esc(i.contacto)}</td><td>${esc(i.tipo)}</td><td class="n">${i.qtd}</td><td class="n">${eur(i.preco)}</td><td class="n">${eur(i.qtd*i.preco)}</td><td>${esc(i.entrega)}</td><td>${esc(i.estado)}</td><td>${esc(i.obs)}</td><td><button class="sec" onclick="ed(${i.id})">Editar</button> <button class="sec" onclick="del(${i.id})">Apagar</button></td></tr>`).join('');
  const act=list.filter(i=>i.estado!=='Cancelado');
  $('tot').textContent=`${list.length} encomendas · ${act.reduce((a,i)=>a+i.qtd,0)} cabazes · ${eur(act.reduce((a,i)=>a+i.qtd*i.preco,0))}`;
  $('tipos').innerHTML=[...new Set(db.items.map(i=>i.tipo))].map(t=>`<option value="${esc(t)}">`).join('');
}
$('f').onsubmit=async e=>{
  e.preventDefault();
  const o={};F.forEach(k=>o[k]=$(k).value.trim());
  o.qtd=+o.qtd;o.preco=+o.preco;
  try{await api(editId?'PUT':'POST',editId,o);reset();await load()}catch(err){fail(err,'Erro ao guardar: ')}
};
function ed(id){
  const i=db.items.find(x=>x.id===id);if(!i)return;
  F.forEach(k=>$(k).value=i[k]??'');editId=id;
  $('save').textContent='Guardar alterações';$('cancel').hidden=false;scrollTo(0,0);
}
async function del(id){if(confirm('Apagar a encomenda '+id+'?')){try{await api('DELETE',id);await load()}catch(err){fail(err,'')}}}
$('cancel').onclick=reset;$('q').oninput=render;$('fe').onchange=render;

$('xl').onclick=()=>{
  const rows=filtered().map(i=>({'Nº':i.id,'Data encomenda':i.data,'Cliente':i.cliente,'Contacto':i.contacto,'Tipo de cabaz':i.tipo,'Quantidade':i.qtd,'Preço unitário':i.preco,'Total':+(i.qtd*i.preco).toFixed(2),'Data entrega':i.entrega,'Estado':i.estado,'Observações':i.obs}));
  if(!rows.length){alert('Sem encomendas para exportar.');return}
  const name='encomendas_cabazes_'+today();
  if(window.XLSX){
    const ws=XLSX.utils.json_to_sheet(rows);
    ws['!cols']=[6,13,24,14,20,10,14,10,13,11,30].map(w=>({wch:w}));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Cabazes');
    XLSX.writeFile(wb,name+'.xlsx');
  }else{ // fallback CSV (sem ligação à internet)
    const h=Object.keys(rows[0]);
    const csv='\ufeff'+[h.join(';'),...rows.map(r=>h.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(';'))].join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name+'.csv';a.click();
  }
};
$('lf').onsubmit=e=>{e.preventDefault();pin=$('pin').value;sessionStorage.setItem('pin',pin);$('pin').value='';gate(true);load()};
reset();if(pin){gate(true);load()}else gate(false);
</script>
</body>
</html>
